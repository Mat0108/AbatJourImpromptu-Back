
services:
  serverabatjour:
    container_name: serverabatjour
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    ports:
      - 8082:8082
    # variable d'environment pour permettre de confirgurer l'acces du server à mongo
    environment:
        - ENV_TYPE=prod
        - NODE_PORT= 8082
        - MONGODB_URL=mongodb://admin:F8G3iKGT%408cASsGy@37.59.112.87:27017/AbatJourImpromptu?authSource=admin&authMechanism=SCRAM-SHA-256

    stdin_open: true
    tty: true
    cap_drop:
      - ALL
    command: ["nodemon", "--legacy-watch", "server.js"]


